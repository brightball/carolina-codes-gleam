[tools]
gleam = "1.18.1"
rebar = "3.25.1"
erlang = "29"
elixir = "1.20.4"
gitleaks = "8.30.1"

[env]
_.source = { path = "scripts/erl_libs.sh", tools = true }

[tasks.test]
description = "Run the gleeunit suite (shipped handlers, not a reimplemented router)"
run = "make test"

[tasks.sast]
description = "PEST static security scan of this app's Erlang/Gleam-compiled source"
run = "make sast"

[tasks.audit]
description = "Audit locked Hex/Gleam dependencies with go_over"
run = "make audit"

[tasks.secrets]
description = "Scan for secrets with gitleaks"
run = "make secrets"

[tasks.format]
description = "Check Gleam formatting"
run = "make format"
