name = "carolina_codes_gleam"
version = "0.2.0"
target = "erlang"
gleam = ">= 1.11.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
pog = ">= 4.1.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
logging = ">= 1.5.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
go_over = ">= 3.3.1 and < 4.0.0"
cactus = ">= 1.4.0 and < 2.0.0"

[erlang]
extra_applications = ["inets", "ssl"]

[go-over]
cache = true
global = false
outdated = false
format = "minimal"

[cactus]
always_init = false

[cactus.pre-commit]
actions = [
  { command = "make", kind = "binary", args = ["test"] },
  { command = "make", kind = "binary", args = ["sast"] },
  { command = "make", kind = "binary", args = ["audit"] },
  { command = "make", kind = "binary", args = ["secrets"] },
  { command = "make", kind = "binary", args = ["format"] },
]
